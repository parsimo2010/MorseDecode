[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morsedecode"
version = "0.1.0"
description = "Multi-channel CW (Morse code) decoder with FFT-based frequency bin analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "rich>=13.0",
    "click>=8.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "numpy>=1.24",
]

[project.scripts]
morsedecode = "morse_decode.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["morse_decode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
