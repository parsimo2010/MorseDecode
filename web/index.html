<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MorseDecode</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header><h1>MorseDecode</h1><p>Live CW audio decoder</p></header>
    <section aria-label="Receiver controls">
      <div class="controls">
        <label>Audio input<select id="device"><option value="">System default</option></select></label>
        <label>Low frequency (Hz)<input id="low" type="number" min="100" max="2999" value="400"></label>
        <label>High frequency (Hz)<input id="high" type="number" min="101" max="3000" value="1000"></label>
      </div>
      <div class="actions">
        <button id="start">Start listening</button>
        <button id="stop" disabled>Stop</button>
        <button id="clear">Clear transcript</button>
      </div>
      <p id="status" role="status">Ready. Select an input and start listening.</p>
    </section>
    <section aria-label="Receiver readout">
      <dl><div><dt>Carrier</dt><dd id="frequency">—</dd></div><div><dt>Keying speed</dt><dd id="speed">—</dd></div></dl>
      <h2>Decoded text</h2>
      <pre id="transcript" tabindex="0"><span id="committed"></span><span id="preview"></span></pre>
    </section>
    <p class="note">Audio stays in this browser. The lighter text is provisional.</p>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
